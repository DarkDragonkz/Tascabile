name: Fix NineManga Lint

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: fix/ninemanga-language-readers
          fetch-depth: 0

      - name: Patch getSelectedLanguage usage
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const filePath = 'src/NineManga/main.ts';
          let content = fs.readFileSync(filePath, 'utf8');

          const replacement = `function getSelectedLanguage(): NineMangaLanguage {
  const stored = Application.getState(LANGUAGE_STATE_KEY) as string | undefined;
  return isNineMangaLanguage(stored) ? stored : DEFAULT_LANGUAGE;
}`;

          content = content.replace(
            /function getSelectedLanguage\(\): NineMangaLanguage \{[\s\S]*?\n\}/u,
            replacement,
          );

          fs.writeFileSync(filePath, content);
          NODE

      - name: Commit feature branch changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/NineManga/main.ts
          if git diff --cached --quiet; then
            echo "No feature branch changes"
          else
            git commit -m "Fix NineManga language lint warning"
            git push origin HEAD:fix/ninemanga-language-readers
          fi

      - name: Marker
        run: echo "trigger 2"
