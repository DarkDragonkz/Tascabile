name: Build and Deploy

on:
  push:
    branches:
      - main
      - "0.9/stable"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  # Superseded pull request runs can stop; a deploy in progress must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to commit SHAs (tags can be moved); the comment names the release.
# To update: `git ls-remote --tags https://github.com/<owner>/<action>` and take the SHA
# of the new release tag.
jobs:
  check:
    name: Check
    # Pinned: `ubuntu-latest` moves to Ubuntu 26 from 19 October 2026.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js Environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # `npm ci` installs exactly the lockfile: a stale lockfile once broke the bundle.
      - name: Install Dependencies
        run: npm ci
      - name: Sync Comic Reader Sources
        run: npm run sync:comics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # After the sync: tests/batcave.test.mjs exercises the generated BatCave source.
      - name: Core Regression Tests
        run: npm run test:core
      - name: TypeScript Check
        run: npm run tsc
      - name: Lint Check
        run: npm run lint:check
      - name: Format Check
        run: npm run format:check
      - name: Bundle Extensions
        run: npm run bundle
      # The Pages artifact is the exact bundle verified above.
      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: bundles

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    # Deploying straight to Pages replaces the old push to `gh-pages`, so GitHub's own
    # "pages build and deployment" workflow (Node 20, `ubuntu-latest`) no longer runs.
    # Requires Settings → Pages → Source: "GitHub Actions".
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
