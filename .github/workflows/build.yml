name: Build and Deploy

on:
  push:
    branches:
      - main
      - "0.9/stable"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  # Superseded pull request runs can stop; a deploy in progress must finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Branch
        uses: actions/checkout@v6
      - name: Setup Node.js Environment
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      # `npm ci` installs exactly the lockfile: a stale lockfile once broke the bundle.
      - name: Install Dependencies
        run: npm ci
      - name: Core Regression Tests
        run: npm run test:core
      - name: Sync Comic Reader Sources
        run: npm run sync:comics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: TypeScript Check
        run: npm run tsc
      - name: Lint Check
        run: npm run lint:check
      - name: Format Check
        run: npm run format:check
      - name: Bundle Extensions
        run: npm run bundle
      - name: Upload Bundles
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: bundles
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Publish the exact bundles the Check job built and verified.
      - name: Download Bundles
        uses: actions/download-artifact@v4
        with:
          name: bundles
          path: bundles
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: bundles
